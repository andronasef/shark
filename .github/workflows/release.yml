# Developer ID DMG on GitHub, plus a Mac App Store build uploaded to App Store Connect. See docs/RELEASING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

env:
  # Match the local Xcode 27.0 (Swift 6.4) toolchain without installing tools.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify Xcode toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Validate release configuration
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo 'Use a tag such as v1.0.0 or v1.0.0-alpha'; exit 1; }
          for name in P12_BASE64 P12_PASSWORD SIGN_IDENTITY NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name"; exit 1; }
          done
          [[ "$SIGN_IDENTITY" == 'Developer ID Application: '* ]] || { echo 'SIGN_IDENTITY must name a Developer ID Application certificate'; exit 1; }

      - name: Check packaging guardrails
        run: bash scripts/test-package.sh

      - name: Verify release tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --silent

      - name: Run tests
        run: swift test

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/shark-build.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          trap 'rm -f "$RUNNER_TEMP/shark-cert.p12"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/shark-cert.p12"
          security create-keychain -p "$password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$password" "$kc"
          security import "$RUNNER_TEMP/shark-cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db

      - name: Build, sign and notarize
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          REQUIRE_NOTARIZATION: "1"
        run: scripts/package.sh "${RELEASE_TAG#v}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          extra_args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            extra_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/Shark-$version.dmg" "dist/Shark-$version.dmg.sha256" \
            --verify-tag --title "Shark $version" --generate-notes "${extra_args[@]}"

      - name: Update Homebrew Cask Tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [[ -n "$TAP_TOKEN" ]]; then
            version="${RELEASE_TAG#v}"
            sha=$(cat "dist/Shark-$version.dmg.sha256" | awk '{print $1}')
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            
            git clone "https://x-access-token:${TAP_TOKEN}@github.com/andronasef/homebrew-shark.git" /tmp/homebrew-shark-tap
            cd /tmp/homebrew-shark-tap
            
            python3 -c "
            import re
            path = 'Casks/shark.rb'
            with open(path, 'r') as f:
                content = f.read()
            content = content.replace('.zip', '.dmg')
            content = re.sub(r'version \".*?\"', f'version \"$version\"', content)
            content = re.sub(r'sha256 .*', f'sha256 \"$sha\"', content)
            with open(path, 'w') as f:
                f.write(content)
            "
            
            git add Casks/shark.rb
            if ! git diff --staged --quiet; then
              git commit -m "Update Shark cask to v$version"
              git push origin main
              echo "Successfully updated Homebrew Cask to v$version!"
            fi
          fi

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/shark-build.keychain-db" || true
          rm -f "$RUNNER_TEMP/shark-cert.p12"

  appstore:
    # Uploads a sandboxed build to App Store Connect. Skipped until the APPSTORE_* secrets exist; uploads with the notarization Apple ID and app-specific password.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      ENABLED: ${{ secrets.APPSTORE_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
        if: env.ENABLED == 'true'

      - name: Verify Xcode toolchain
        if: env.ENABLED == 'true'
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          swift --version

      - name: Import App Store certificates
        if: env.ENABLED == 'true'
        env:
          P12_BASE64: ${{ secrets.APPSTORE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_P12_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/shark-appstore.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          trap 'rm -f "$RUNNER_TEMP/appstore.p12"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/appstore.p12"
          security create-keychain -p "$password" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$password" "$kc"
          security import "$RUNNER_TEMP/appstore.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -k "$password" "$kc"
          security list-keychains -d user -s "$kc" login.keychain-db

      - name: Build sandboxed package
        if: env.ENABLED == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPSTORE_PROFILE_BASE64 }}
          # CFBundleVersion must increase on every upload.
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/Shark.provisionprofile"
          # The App Store only accepts digits and dots, so v1.0.0-alpha.N uploads as another build of 1.0.0.
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          echo "APPSTORE_VERSION=$version" >> "$GITHUB_ENV"
          PROVISIONING_PROFILE="$RUNNER_TEMP/Shark.provisionprofile" bash scripts/package-appstore.sh "$version"

      - name: Upload to App Store Connect
        if: env.ENABLED == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "${APPSTORE_VERSION:-}" ]] || { echo "No App Store package was built; nothing to upload"; exit 0; }
          xcrun altool --upload-app -f dist/Shark-*.pkg -t macos -u "$NOTARY_APPLE_ID" -p "$NOTARY_PASSWORD" --asc-provider "$NOTARY_TEAM_ID"

      - name: Remove signing material
        if: always() && env.ENABLED == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/shark-appstore.keychain-db" || true
          rm -f "$RUNNER_TEMP/Shark.provisionprofile"
